# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: push this repo, then in Render choose "New > Blueprint" and point at it.
# Hardening notes and the full pre-launch checklist live in 04-hosting-hardening.md.
services:
  - type: web
    name: perfumes
    runtime: node
    plan: starter          # persistent disks require a paid plan
    region: oregon
    # npm ci installs the exact lockfile set (reproducible, supply-chain safe).
    # --omit=dev skips dev dependencies; NPM_CONFIG_PRODUCTION=false overrides the
    # platform's deprecated "production" config so npm prints no warning.
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/auth/me
    # Prefer manual deploys for a trading system; set true to deploy on every push.
    autoDeploy: true
    # Give the process time to close the database cleanly on redeploy.
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      # Silence npm's deprecated "production" config warning during install.
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      # Store the SQLite database on the mounted persistent disk.
      - key: PTP_DATA_DIR
        value: /var/data
      # Session cookie over HTTPS only.
      - key: PTP_SECURE_COOKIES
        value: "1"
      # Load supplier lists + demo data automatically on an empty database.
      # Set to "false" once the instance holds real data (see 04-hosting-hardening.md §6).
      - key: PTP_AUTO_SEED
        value: "true"
      # Admin credentials. Set PTP_ADMIN_PASS as a secret in the dashboard.
      - key: PTP_ADMIN_USER
        value: admin
      - key: PTP_ADMIN_PASS
        sync: false
    disk:
      name: ptp-data
      mountPath: /var/data
      sizeGB: 1

